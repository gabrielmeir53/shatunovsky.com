name: Validate & Deploy

on:
  push:
    branches: [main]

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site (Eleventy -> _site/)
        run: npm run build

      - name: Validate HTML
        run: npm run lint

      # rsync --delete from an empty or half-built folder would wipe the live site, so refuse to
      # deploy unless the build output looks complete.
      - name: Sanity-check build output
        run: |
          for f in index.html resume.html writing.html beyond.html contact.html mail.html \
                   css/style.css js/main.js softball/index.html favicon.ico robots.txt sitemap.xml; do
            test -s "_site/$f" || { echo "::error::_site/$f is missing or empty - not deploying"; exit 1; }
          done
          test "$(find _site -type f | wc -l)" -ge 30

      - name: Deploy to Droplet
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 104.131.45.126 >> ~/.ssh/known_hosts
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            --exclude 'calendars' \
            _site/ root@104.131.45.126:/var/www/shatunovsky.com/
